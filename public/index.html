<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色互動場景 Demo</title>
<style>
  :root{
    --ink:#2b2420;
    --paper:#f6efe4;
    --paper-2:#efe4d2;
    --line:#d8c9ae;
    --moss:#5c7a5e;
    --moss-dark:#3f5941;
    --clay:#b5623f;
    --sky:#c9ddd6;
    --sun:#e8b559;
    --shadow: rgba(43,36,32,0.18);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    max-width:1180px;
    margin:0 auto;
    padding:18px 18px 0;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-bottom:12px;
    border-bottom:2px solid var(--line);
    margin-bottom:14px;
  }
  header h1{
    font-size:22px;
    margin:0;
    letter-spacing:0.5px;
    font-weight:800;
  }
  header .eyebrow{
    font-size:12px;
    color:var(--moss-dark);
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:700;
  }
  header .tag{
    font-size:12px;
    color:#8a7a63;
  }
  main{
    display:flex;
    gap:16px;
    flex:1;
    min-height:0;
    padding-bottom:16px;
  }
  /* ---------- Scene ---------- */
  .scene-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .scene{
    position:relative;
    flex:1;
    border-radius:18px;
    overflow:hidden;
    border:3px solid var(--ink);
    background:
      radial-gradient(circle at 20% 15%, #e9f2ec 0%, transparent 40%),
      linear-gradient(180deg, var(--sky) 0%, var(--sky) 32%, #ded1b3 32%, #d8c9a4 100%);
    cursor: crosshair;
    box-shadow: inset 0 0 40px rgba(43,36,32,0.12);
  }
  .scene::before{ /* sun */
    content:"";
    position:absolute;
    top:26px; right:40px;
    width:46px; height:46px;
    border-radius:50%;
    background: var(--sun);
    box-shadow: 0 0 0 8px rgba(232,181,89,0.25);
  }
  .prop{
    position:absolute;
    opacity:0.9;
    pointer-events:none;
    user-select:none;
  }
  .hint{
    position:absolute;
    bottom:10px; left:50%;
    transform:translateX(-50%);
    font-size:12px;
    background:rgba(43,36,32,0.7);
    color:#fff;
    padding:5px 12px;
    border-radius:20px;
    pointer-events:none;
    transition:opacity .4s;
  }
  .char{
    position:absolute;
    width:56px;
    transform:translate(-50%,-100%);
    transition: left 0.6s cubic-bezier(.4,0,.2,1), top 0.6s cubic-bezier(.4,0,.2,1);
    cursor:pointer;
    user-select:none;
  }
  .char .shadow-oval{
    position:absolute;
    bottom:-4px; left:50%;
    width:34px; height:10px;
    background:var(--shadow);
    border-radius:50%;
    transform:translateX(-50%);
  }
  .char .body-svg{ display:block; }
  .char .name-tag{
    position:absolute;
    top:-16px; left:50%;
    transform:translateX(-50%);
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
    background:var(--paper);
    border:1.5px solid var(--ink);
    border-radius:8px;
    padding:1px 7px;
  }
  .char.selected .body-svg{
    filter: drop-shadow(0 0 0 2px var(--clay)) drop-shadow(0 0 6px rgba(181,98,63,0.6));
  }
  .char .sprite{
    transition: transform 0.15s ease;
  }
  .char .sprite.face-left{
    transform: scaleX(-1);
  }
  .char .bob.walking{
    animation: walk-bob 0.32s ease-in-out infinite;
  }
  @keyframes walk-bob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-4px); }
  }
  .char .bubble{
    position:absolute;
    bottom: 100%;
    left:50%;
    transform:translateX(-50%) translateY(-6px);
    background:#fff;
    border:2px solid var(--ink);
    border-radius:14px;
    padding:6px 10px;
    font-size:12px;
    max-width:150px;
    white-space:normal;
    text-align:center;
    opacity:0;
    transition:opacity .25s, transform .25s;
    pointer-events:none;
  }
  .char .bubble::after{
    content:"";
    position:absolute;
    top:100%; left:50%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:var(--ink);
  }
  .char .bubble.show{
    opacity:1;
    transform:translateX(-50%) translateY(-10px);
  }

  .scene-toolbar{
    display:flex;
    gap:8px;
    align-items:center;
    padding:10px 2px 0;
    font-size:12px;
    color:#7a6c56;
  }
  .scene-toolbar button{
    font-family:inherit;
    font-size:12px;
    padding:6px 12px;
    border-radius:8px;
    border:1.5px solid var(--ink);
    background:var(--paper-2);
    cursor:pointer;
    font-weight:700;
  }
  .scene-toolbar button:hover{ background:var(--moss); color:#fff; border-color:var(--moss);}

  /* ---------- Side panel ---------- */
  .panel{
    width:280px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow-y:auto;
  }
  .card{
    background:var(--paper-2);
    border:2px solid var(--ink);
    border-radius:14px;
    padding:12px 14px;
  }
  .card h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin:0 0 10px;
    color:var(--moss-dark);
  }
  .char-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .char-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    border-radius:8px;
    cursor:pointer;
    border:1.5px solid transparent;
  }
  .char-row:hover{ background:rgba(255,255,255,0.5); }
  .char-row.active{
    border-color:var(--clay);
    background:#fff;
  }
  .char-row .dot{
    width:14px;height:14px;border-radius:50%;
    border:1.5px solid var(--ink);
    flex-shrink:0;
  }
  .char-row span{ font-size:13px; font-weight:600; flex:1; }
  .char-row input[type=text]{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    border:none;
    background:transparent;
    flex:1;
    min-width:0;
    outline:none;
  }
  .add-btn{
    margin-top:8px;
    width:100%;
    padding:8px;
    border-radius:8px;
    border:1.5px dashed var(--ink);
    background:transparent;
    font-family:inherit;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
    color:var(--moss-dark);
  }
  .add-btn:hover{ background:var(--moss); color:#fff; border-style:solid; }

  .swatch-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .swatch-row .label{
    width:100%;
    font-size:11px;
    color:#8a7a63;
    font-weight:700;
    margin-bottom:2px;
  }
  .swatch{
    width:22px; height:22px;
    border-radius:50%;
    border:2px solid var(--ink);
    cursor:pointer;
  }
  .swatch.active{
    outline:2px solid var(--clay);
    outline-offset:2px;
  }

  /* ---------- Chat ---------- */
  .chat-card{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:160px;
  }
  .chat-log{
    flex:1;
    overflow-y:auto;
    font-size:12.5px;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding-right:2px;
    margin-bottom:8px;
  }
  .chat-log .row{
    line-height:1.4;
  }
  .chat-log .who{
    font-weight:800;
  }
  .chat-log .time{
    color:#a1927a;
    font-size:10.5px;
    margin-left:4px;
  }
  .chat-log .sys{
    color:#8a7a63;
    font-style:italic;
  }
  .chat-input-row{
    display:flex;
    gap:6px;
  }
  .chat-input-row input{
    flex:1;
    font-family:inherit;
    font-size:13px;
    padding:8px 10px;
    border-radius:8px;
    border:1.5px solid var(--ink);
    outline:none;
  }
  .chat-input-row button{
    font-family:inherit;
    font-weight:700;
    font-size:12px;
    padding:0 14px;
    border-radius:8px;
    border:1.5px solid var(--ink);
    background:var(--clay);
    color:#fff;
    cursor:pointer;
  }
  .chat-input-row button:hover{ background:#95502f; }
  .chat-input-row button:disabled{
    background:#cbbfa9; border-color:#cbbfa9; cursor:not-allowed;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  @media (max-width:820px){
    main{ flex-direction:column; }
    .panel{ width:100%; flex-direction:row; flex-wrap:wrap; }
    .card{ flex:1; min-width:220px; }
    .chat-card{ min-height:220px; }
  }

  /* ---------- Join overlay (選角色進場) ---------- */
  .join-overlay{
    position:fixed; inset:0;
    background:rgba(43,36,32,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:16px;
  }
  .join-overlay.hidden{ display:none; }
  .join-card{
    width:100%; max-width:360px;
    background:var(--paper);
    border:2.5px solid var(--ink);
    border-radius:16px;
    padding:22px 22px 18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  .join-card h2{
    margin:0 0 4px;
    font-size:18px;
  }
  .join-card .sub{
    margin:0 0 16px;
    font-size:12px;
    color:#8a7a63;
  }
  .join-card label{
    display:block;
    font-size:11px;
    font-weight:700;
    color:var(--moss-dark);
    text-transform:uppercase;
    letter-spacing:1px;
    margin:14px 0 6px;
  }
  .join-card input[type=text]{
    width:100%;
    font-family:inherit;
    font-size:14px;
    padding:9px 10px;
    border-radius:8px;
    border:1.5px solid var(--ink);
    outline:none;
    box-sizing:border-box;
  }
  .join-preview{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:6px;
  }
  .join-btn{
    width:100%;
    margin-top:18px;
    padding:11px;
    font-family:inherit;
    font-weight:800;
    font-size:14px;
    border-radius:10px;
    border:1.5px solid var(--ink);
    background:var(--clay);
    color:#fff;
    cursor:pointer;
  }
  .join-btn:hover{ background:#95502f; }
  .join-btn:disabled{ background:#cbbfa9; border-color:#cbbfa9; cursor:not-allowed; }
  .join-error{
    color:#a13a2e;
    font-size:12px;
    margin-top:8px;
    min-height:14px;
  }
  .online-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    font-weight:700;
    color:var(--moss-dark);
    background:var(--paper-2);
    border:1.5px solid var(--ink);
    border-radius:20px;
    padding:3px 10px;
  }
  .online-badge .pip{
    width:7px; height:7px; border-radius:50%;
    background:var(--moss);
  }
  .char-row.self{
    background:#fff;
    border-color:var(--moss);
  }
  .char-row .you-tag{
    font-size:9px;
    font-weight:800;
    color:#fff;
    background:var(--moss);
    border-radius:6px;
    padding:1px 5px;
    flex-shrink:0;
  }
  .char.self .name-tag{
    border-color:var(--moss);
  }
</style>
</head>
<body>

<div class="join-overlay" id="joinOverlay">
  <div class="join-card">
    <h2>選角色，進入場景</h2>
    <p class="sub">輸入你的名字並挑選外觀，就能和其他正在線上的人一起出現在同一個場景裡。</p>

    <label>你的名字</label>
    <input id="joinName" type="text" maxlength="16" placeholder="例如：小魚" autocomplete="off">

    <label>髮色</label>
    <div class="swatch-row" id="joinHairSwatches"></div>

    <label>衣服顏色</label>
    <div class="swatch-row" id="joinBodySwatches"></div>

    <div class="join-preview" id="joinPreview"></div>

    <button class="join-btn" id="joinBtn">進入場景</button>
    <div class="join-error" id="joinError"></div>
  </div>
</div>

<div class="app">
  <header>
    <div>
      <div class="eyebrow">Multiplayer · Socket.io</div>
      <h1>角色互動場景</h1>
    </div>
    <div class="tag" style="display:flex; align-items:center; gap:10px;">
      <span>點場景移動 → 輸入訊息聊天</span>
      <span class="online-badge"><span class="pip"></span><span id="onlineCount">連線中…</span></span>
    </div>
  </header>

  <main>
    <div class="scene-wrap">
      <div class="scene" id="scene">
        <div class="hint" id="hint">點選角色，再點場景空白處移動它</div>
      </div>
      <div class="scene-toolbar">
        <button id="wanderBtn">讓我亂走一下</button>
        <span id="statusText"></span>
      </div>
    </div>

    <div class="panel">
      <div class="card">
        <h2>線上玩家</h2>
        <div class="char-list" id="charList"></div>
      </div>

      <div class="card" id="customizeCard">
        <h2>捏一捏（我的外觀）</h2>
        <div class="swatch-row" id="hairSwatches"><div class="label">髮色</div></div>
        <div class="swatch-row" id="bodySwatches"><div class="label">衣服顏色</div></div>
      </div>

      <div class="card chat-card">
        <h2>對話紀錄</h2>
        <div class="chat-log" id="chatLog"></div>
        <div class="chat-input-row">
          <input id="chatInput" type="text" placeholder="選取角色後輸入訊息…" maxlength="60">
          <button id="sendBtn">送出</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 
  重要：這裡要指向你部署到 Render/Railway 等平台後拿到的網址，
  例如 https://socket-scene.onrender.com/socket.io/socket.io.js
  部署完成、拿到網址後，把下面這行的 YOUR_BACKEND_URL 換掉即可。
-->
<script src="https://YOUR_BACKEND_URL/socket.io/socket.io.js"></script>
<script>
(function(){
  const HAIR_COLORS = ["#3b2a20","#8a5a34","#c99a4a","#d94f4f","#5c7a5e","#4a5b8a"];
  const BODY_COLORS = ["#b5623f","#e8b559","#5c7a5e","#4a5b8a","#8a5a8a","#3b2a20"];

  const scene = document.getElementById('scene');
  const charList = document.getElementById('charList');
  const chatLogEl = document.getElementById('chatLog');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const hint = document.getElementById('hint');
  const hairSwatches = document.getElementById('hairSwatches');
  const bodySwatches = document.getElementById('bodySwatches');
  const statusText = document.getElementById('statusText');
  const onlineCountEl = document.getElementById('onlineCount');

  const joinOverlay = document.getElementById('joinOverlay');
  const joinName = document.getElementById('joinName');
  const joinHairSwatches = document.getElementById('joinHairSwatches');
  const joinBodySwatches = document.getElementById('joinBodySwatches');
  const joinPreview = document.getElementById('joinPreview');
  const joinBtn = document.getElementById('joinBtn');
  const joinError = document.getElementById('joinError');

  // ---- Local mirror of server state ----
  let characters = {};   // id -> character object (server is source of truth)
  let myId = null;
  let charEls = {};      // id -> root <div class="char"> element, kept alive across moves

  let pendingHair = HAIR_COLORS[Math.floor(Math.random()*HAIR_COLORS.length)];
  let pendingBody = BODY_COLORS[Math.floor(Math.random()*BODY_COLORS.length)];

  function svgFor(hair, body){
    return `
    <svg class="body-svg" width="56" height="72" viewBox="0 0 56 72" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="28" cy="66" rx="15" ry="5" fill="rgba(43,36,32,0.15)"/>
      <path d="M14 40 Q14 26 28 26 Q42 26 42 40 L42 62 Q42 68 28 68 Q14 68 14 62 Z" fill="${body}" stroke="#2b2420" stroke-width="2"/>
      <circle cx="28" cy="16" r="13" fill="#f2d3ae" stroke="#2b2420" stroke-width="2"/>
      <path d="M15 14 Q15 2 28 2 Q41 2 41 14 Q41 8 34 8 Q30 3 24 8 Q18 6 15 14 Z" fill="${hair}" stroke="#2b2420" stroke-width="2"/>
      <circle cx="23" cy="17" r="1.6" fill="#2b2420"/>
      <circle cx="33" cy="17" r="1.6" fill="#2b2420"/>
      <path d="M24 22 Q28 25 32 22" stroke="#2b2420" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>`;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ---------------------------------------------------------------
  // Join screen (選角色)
  // ---------------------------------------------------------------
  function buildJoinSwatches(){
    joinHairSwatches.innerHTML = '';
    HAIR_COLORS.forEach(col => {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (col === pendingHair ? ' active' : '');
      sw.style.background = col;
      sw.addEventListener('click', () => { pendingHair = col; buildJoinSwatches(); renderJoinPreview(); });
      joinHairSwatches.appendChild(sw);
    });
    joinBodySwatches.innerHTML = '';
    BODY_COLORS.forEach(col => {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (col === pendingBody ? ' active' : '');
      sw.style.background = col;
      sw.addEventListener('click', () => { pendingBody = col; buildJoinSwatches(); renderJoinPreview(); });
      joinBodySwatches.appendChild(sw);
    });
  }
  function renderJoinPreview(){
    joinPreview.innerHTML = svgFor(pendingHair, pendingBody);
  }
  buildJoinSwatches();
  renderJoinPreview();

  function doJoin(){
    const name = joinName.value.trim();
    if(!name){
      joinError.textContent = '請先輸入名字';
      joinName.focus();
      return;
    }
    joinBtn.disabled = true;
    joinError.textContent = '';
    socket.emit('join', { name, hair: pendingHair, body: pendingBody });
  }
  joinBtn.addEventListener('click', doJoin);
  joinName.addEventListener('keydown', e => { if(e.key === 'Enter') doJoin(); });

  // ---------------------------------------------------------------
  // Character rendering
  // ---------------------------------------------------------------
  function createCharElement(c){
    const el = document.createElement('div');
    el.className = 'char' + (c.id === myId ? ' self' : '');
    el.style.left = c.x + '%';
    el.style.top = c.y + '%';
    el.dataset.id = c.id;
    el.innerHTML = `
      <div class="name-tag">${escapeHtml(c.name)}${c.id === myId ? ' (你)' : ''}</div>
      <div class="bubble" id="bubble-${c.id}"></div>
      <div class="sprite" id="sprite-${c.id}">
        <div class="bob" id="bob-${c.id}">${svgFor(c.hair, c.body)}</div>
      </div>
    `;
    scene.appendChild(el);
    charEls[c.id] = el;
    return el;
  }

  function removeCharElement(id){
    const el = charEls[id];
    if(el){
      el.style.transition = 'opacity .35s';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 360);
      delete charEls[id];
    }
  }

  function updateAppearance(c){
    const bob = document.getElementById('bob-' + c.id);
    if(bob) bob.innerHTML = svgFor(c.hair, c.body);
  }

  // Moves an existing character node to a new spot, timing the CSS
  // transition to the distance travelled so far walks feel fast and
  // near walks feel short, plus a little bob + turn-to-face polish.
  function moveCharacterTo(c, xPct, yPct){
    const el = charEls[c.id];
    if(!el) return;
    const rect = scene.getBoundingClientRect();
    const dxPx = ((xPct - c.x) / 100) * rect.width;
    const dyPx = ((yPct - c.y) / 100) * rect.height;
    const dist = Math.sqrt(dxPx * dxPx + dyPx * dyPx);
    const speed = 160; // px per second
    const duration = Math.min(2.5, Math.max(0.35, dist / speed));
    el.style.transitionDuration = duration.toFixed(2) + 's';

    const sprite = document.getElementById('sprite-' + c.id);
    if(sprite && Math.abs(dxPx) > 2){
      sprite.classList.toggle('face-left', dxPx < 0);
    }
    const bob = document.getElementById('bob-' + c.id);
    if(bob) bob.classList.add('walking');

    c.x = xPct;
    c.y = yPct;
    el.style.left = c.x + '%';
    el.style.top = c.y + '%';

    clearTimeout(el._walkTimer);
    el._walkTimer = setTimeout(() => {
      if(bob) bob.classList.remove('walking');
    }, duration * 1000);
  }

  function renderCharList(){
    charList.innerHTML = '';
    Object.values(characters)
      .sort((a,b) => (a.id === myId ? -1 : b.id === myId ? 1 : 0))
      .forEach(c => {
        const isSelf = c.id === myId;
        const row = document.createElement('div');
        row.className = 'char-row' + (isSelf ? ' self' : '');
        if(isSelf){
          row.innerHTML = `
            <div class="dot" style="background:${c.body}"></div>
            <input type="text" value="${escapeHtml(c.name)}" data-id="${c.id}">
            <span class="you-tag">你</span>
          `;
          const input = row.querySelector('input');
          input.addEventListener('change', () => {
            const name = input.value.trim() || '無名旅人';
            socket.emit('rename', { name });
          });
        } else {
          row.innerHTML = `
            <div class="dot" style="background:${c.body}"></div>
            <span>${escapeHtml(c.name)}</span>
          `;
        }
        charList.appendChild(row);
      });
  }

  function renderCustomizer(){
    const c = characters[myId];
    hairSwatches.innerHTML = '<div class="label">髮色</div>';
    bodySwatches.innerHTML = '<div class="label">衣服顏色</div>';
    if(!c) return;
    HAIR_COLORS.forEach(col => {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (c.hair === col ? ' active' : '');
      sw.style.background = col;
      sw.addEventListener('click', () => {
        socket.emit('customize', { hair: col, body: c.body });
      });
      hairSwatches.appendChild(sw);
    });
    BODY_COLORS.forEach(col => {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (c.body === col ? ' active' : '');
      sw.style.background = col;
      sw.addEventListener('click', () => {
        socket.emit('customize', { hair: c.hair, body: col });
      });
      bodySwatches.appendChild(sw);
    });
  }

  function addChatLine(who, text, isSystem){
    const row = document.createElement('div');
    row.className = 'row' + (isSystem ? ' sys' : '');
    const time = new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'});
    if(isSystem){
      row.textContent = text;
    } else {
      row.innerHTML = `<span class="who">${escapeHtml(who)}</span><span class="time">${time}</span>：${escapeHtml(text)}`;
    }
    chatLogEl.appendChild(row);
    chatLogEl.scrollTop = chatLogEl.scrollHeight;
  }

  function showBubble(id, text){
    const bubble = document.getElementById('bubble-' + id);
    if(!bubble) return;
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubble._t);
    bubble._t = setTimeout(() => bubble.classList.remove('show'), 3200);
  }

  // ---------------------------------------------------------------
  // Scene click => move MY character only
  // ---------------------------------------------------------------
  scene.addEventListener('click', (e) => {
    if(!myId || !characters[myId]) return;
    const rect = scene.getBoundingClientRect();
    const xPct = ((e.clientX - rect.left) / rect.width) * 100;
    const yPct = ((e.clientY - rect.top) / rect.height) * 100;
    const targetX = Math.min(95, Math.max(5, xPct));
    const targetY = Math.min(92, Math.max(20, yPct));
    socket.emit('move', { x: targetX, y: targetY });
    hint.style.opacity = '0';
  });

  // ---------------------------------------------------------------
  // Chat send
  // ---------------------------------------------------------------
  function sendMessage(){
    const text = chatInput.value.trim();
    if(!myId || !text) return;
    socket.emit('chat', { text });
    chatInput.value = '';
  }
  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });

  // ---------------------------------------------------------------
  // Wander (random move — my character only)
  // ---------------------------------------------------------------
  document.getElementById('wanderBtn').addEventListener('click', () => {
    if(!myId) return;
    const tx = Math.min(95, Math.max(5, 15 + Math.random()*70));
    const ty = Math.min(92, Math.max(20, 25 + Math.random()*55));
    socket.emit('move', { x: tx, y: ty });
  });

  // ---------------------------------------------------------------
  // Socket.io wiring
  // ---------------------------------------------------------------
  // 同上，這裡也要換成一樣的後端網址
  const socket = io('https://YOUR_BACKEND_URL');

  socket.on('connect', () => {
    statusText.textContent = '已連線到伺服器';
  });

  socket.on('disconnect', () => {
    statusText.textContent = '與伺服器斷線，正在嘗試重新連線…';
    onlineCountEl.textContent = '離線';
  });

  socket.on('init', (data) => {
    myId = data.selfId;
    characters = {};
    charEls = {};
    scene.querySelectorAll('.char').forEach(el => el.remove());

    data.characters.forEach(c => {
      characters[c.id] = c;
      createCharElement(c);
    });

    chatLogEl.innerHTML = '';
    data.chatLog.forEach(m => addChatLine(m.who, m.text, m.isSystem));

    joinOverlay.classList.add('hidden');
    renderCharList();
    renderCustomizer();
    chatInput.focus();
    statusText.textContent = '已加入場景';
  });

  socket.on('char-joined', (c) => {
    characters[c.id] = c;
    createCharElement(c);
    renderCharList();
  });

  socket.on('char-left', ({ id }) => {
    removeCharElement(id);
    delete characters[id];
    renderCharList();
  });

  socket.on('char-moved', ({ id, x, y }) => {
    const c = characters[id];
    if(!c) return;
    moveCharacterTo(c, x, y);
  });

  socket.on('char-customized', ({ id, hair, body }) => {
    const c = characters[id];
    if(!c) return;
    c.hair = hair; c.body = body;
    updateAppearance(c);
    renderCharList();
    if(id === myId) renderCustomizer();
  });

  socket.on('char-renamed', ({ id, name }) => {
    const c = characters[id];
    if(!c) return;
    c.name = name;
    const el = charEls[id];
    const tag = el && el.querySelector('.name-tag');
    if(tag) tag.textContent = name + (id === myId ? ' (你)' : '');
    renderCharList();
  });

  socket.on('char-bubble', ({ id, text }) => {
    showBubble(id, text);
  });

  socket.on('chat-message', (msg) => {
    addChatLine(msg.who, msg.text, msg.isSystem);
  });

  socket.on('online-count', (n) => {
    onlineCountEl.textContent = n + ' 人在線';
  });

  socket.on('connect_error', () => {
    statusText.textContent = '連線失敗，請確認伺服器已啟動 (node server.js)';
  });

  // Focus name field on load
  joinName.focus();
})();

</script>
</body>
</html>
